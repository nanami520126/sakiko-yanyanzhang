version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: sakiko-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: sakiko_take_out
      TZ: Asia/Shanghai
    volumes:
      - ./sakiko-prod.sql:/docker-entrypoint-initdb.d/01-sakiko-prod.sql:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:5.0.14
    container_name: sakiko-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./sakiko-take-out
    container_name: sakiko-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    env_file:
      - .env
    ports:
      - "8080:8080"

  frontend:
    build: ./sakiko-take-out-frontend
    container_name: sakiko-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
